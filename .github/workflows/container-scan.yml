# TradeOS — Container Scan (Sprint 9.4, Deployment Readiness &
# Operational Hardening). Construye la imagen Docker real del backend
# (backend/Dockerfile, Sprint 9.1) únicamente para que Trivy la escanee
# — no se publica ni se despliega a ningún registro (fuera de alcance de
# este sprint; ver CHANGELOG.md, Sprint 9.4).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/container-scan.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/container-scan.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sin `security-events: write` / `actions: read`: este repositorio es
# privado y pertenece a una cuenta personal (no una organización), y
# GitHub Code Security / Advanced Security — requisito real de
# `upload-sarif` — no está disponible para repositorios privados fuera
# de un plan GitHub Team o Enterprise (docs.github.com, "About GitHub
# Advanced Security": "You must be on a GitHub Team or GitHub Enterprise
# plan in order to purchase GitHub Code Security"). Verificado de forma
# concluyente, no asumido, contra la API real de este repositorio:
# `gh api repos/.../code-scanning/alerts` y `.../code-scanning/default-setup`
# devuelven ambos 403 "Code scanning is not enabled for this repository."
# Por eso no se sube nada a la pestaña Security — ver la decisión de
# Trivy más abajo para el reemplazo (artifact de workflow, sin licencia
# requerida). `contents: read` sigue siendo suficiente para todo lo demás
# que este workflow hace.
permissions:
  contents: read

jobs:
  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build -t tradeos-backend:${{ github.sha }} ./backend

      # severity: 'CRITICAL,HIGH' + exit-code: '1' es exactamente el
      # ejemplo oficial de trivy-action para fallar el build
      # (github.com/aquasecurity/trivy-action) — sin este exit-code,
      # el default (0) nunca fallaría el workflow pese a hallazgos reales.
      - name: Trivy scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "tradeos-backend:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      # Segunda pasada, en SARIF, siempre ejecutada (incluso si la
      # anterior ya falló el job) para conservar un reporte estructurado
      # y descargable — no se sube a la pestaña Security de GitHub
      # (requiere GitHub Code Security, no disponible en este repositorio
      # privado de cuenta personal; ver justificación completa en el
      # bloque `permissions:` de arriba).
      #
      # limit-severities-for-sarif: 'true' es obligatorio para que el
      # SARIF realmente respete `severity: CRITICAL,HIGH` — verificado
      # leyendo el entrypoint.sh real de trivy-action@v0.36.0: sin este
      # input, la propia Action descarta el filtro de severidad para
      # formato SARIF y sube todas las severidades sin excepción
      # ("Building SARIF report with all severities").
      - name: Trivy scan (SARIF artifact)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "tradeos-backend:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: "true"
          exit-code: "0"

      # actions/upload-artifact no requiere ningún permiso especial de
      # GITHUB_TOKEN ni licencia — es la alternativa que no depende de
      # GitHub Code Security. El reporte queda descargable desde la
      # página del run durante 90 días (retención por defecto de GitHub).
      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
          if-no-files-found: error
