[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; sqlalchemy.url is deliberately not set here — env.py reads DATABASE_URL
; from the environment (app/platform/config.py's Settings), matching the
; SQLAlchemy 2.0 async + asyncpg driver already mandated by
; TRADEOS_TECHNICAL_STACK.md §7. No second (sync) driver is introduced.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
