[tool.poetry]
name = "tradeos-backend"
version = "0.1.0"
description = "TradeOS backend — Modular Monolith, Clean Architecture per TRADEOS_SYSTEM_ARCHITECTURE.md and TRADEOS_BACKEND_BLUEPRINT.md."
authors = ["TradeOS"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.30" }
asyncpg = "^0.31.0"
alembic = "^1.13.1"
pydantic = { extras = ["email"], version = "^2.7.1" }
pydantic-settings = "^2.3.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
argon2-cffi = "^23.1.0"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
testcontainers = { extras = ["postgres"], version = "^4.7.0" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = false
